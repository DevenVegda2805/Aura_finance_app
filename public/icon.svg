<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base (Maskable Safe Zone compliant) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Inner Subtle Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>
  
  <!-- Apple Wallet-style Layered Financial Cards -->
  <g filter="url(#softShadow)" transform="translate(68, 100)">
    <!-- Back Card -->
    <rect x="36" y="20" width="304" height="190" rx="24" fill="#334155" opacity="0.75" />
    <!-- Middle Card -->
    <rect x="20" y="50" width="336" height="200" rx="24" fill="#475569" opacity="0.9" />
    <!-- Front Card (Vibrant Gradient Card) -->
    <rect x="0" y="80" width="376" height="232" rx="26" fill="url(#cardGrad)"/>
    
    <!-- Card Chip / Ring Graphic -->
    <circle cx="64" cy="144" r="26" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle cx="64" cy="144" r="14" fill="#FFFFFF" fill-opacity="0.85"/>
    
    <!-- Card Line Accent -->
    <rect x="64" y="200" width="140" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.75"/>
    <rect x="64" y="224" width="80" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.45"/>
    
    <!-- Mini Donut Segment -->
    <circle cx="304" cy="196" r="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="12"/>
    <circle cx="304" cy="196" r="32" fill="none" stroke="url(#glowGrad)" stroke-width="12" stroke-dasharray="140 200" stroke-linecap="round"/>
  </g>
</svg>
