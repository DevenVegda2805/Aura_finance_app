<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Aura - Expense &amp; Savings Manager</title>
    <meta name="description" content="Apple Wallet-inspired personal expense and savings manager with category budgeting, interactive pie charts, visual spending reports, and savings goal tracking." />
    <meta property="og:title" content="Aura - Expense &amp; Savings Manager" />
    <meta property="og:description" content="Apple Wallet-inspired personal expense and savings manager with category budgeting, interactive pie charts, visual spending reports, and savings goal tracking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- Google Fonts: Plus Jakarta Sans & DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <!-- Immediate theme check to prevent flash of light theme -->
    <script>
      try {
        var rawSettings = localStorage.getItem('aura_clean_settings_v3');
        if (rawSettings) {
          var parsed = JSON.parse(rawSettings);
          if (parsed && parsed.darkMode) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F5F5F7] dark:bg-[#0A0D14] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
